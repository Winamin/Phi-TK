<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phi TK</title>
    <script>
      (function () {
        var root = document.documentElement;

        var mode = null;
        try {
          mode = localStorage.getItem('themeMode');
        } catch (e) {}
        if (mode !== 'light' && mode !== 'auto' && mode !== 'dark') mode = 'dark';
        var dark =
          mode === 'dark' || (mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
        root.classList.add(dark ? 'mdui-theme-dark' : 'mdui-theme-light');

        var locale = null;
        try {
          locale = localStorage.getItem('locale');
        } catch (e) {}
        if (!locale) {
          locale = 'en';
          var langs = navigator.languages || [navigator.language || 'en'];
          for (var i = 0; i < langs.length; i++) {
            if (langs[i] === 'zh-CN' || langs[i] === 'zh-TW') {
              locale = langs[i];
              break;
            }
          }
        }
        root.lang = locale.indexOf('zh') === 0 ? 'zh-CN' : 'en';
      })();
    </script>
    <style>
      /* Hide mdui Web Components until their definitions are registered, so the
         page never flashes unstyled/unsized custom elements. */
      :not(:defined) {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
